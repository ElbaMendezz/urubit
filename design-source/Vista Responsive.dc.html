</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  state = { view: 'all' };

  componentDidMount() {
    this._onResize = () => this.layout();
    window.addEventListener('resize', this._onResize);
    this.layout();
    setTimeout(() => this.layout(), 400);
  }
  componentDidUpdate() { this.layout(); }
  componentWillUnmount() { if (this._onResize) window.removeEventListener('resize', this._onResize); }

  layout() {
    const stage = document.querySelector('[data-stage]');
    if (!stage) return;
    const view = this.state.view;
    const devs = Array.from(document.querySelectorAll('[data-dev]'));
    const visible = devs.filter((d) => view === 'all' || d.getAttribute('data-dev') === view);
    devs.forEach((d) => { d.style.display = visible.includes(d) ? 'flex' : 'none'; });

    const gap = 34;
    const chromeOf = (d) => {
      const sh = d.querySelector('[data-shell]');
      if (!sh) return 0;
      const cs = getComputedStyle(sh);
      return parseFloat(cs.borderLeftWidth || 0) + parseFloat(cs.borderRightWidth || 0);
    };
    const chromeTotal = visible.reduce((sum, d) => sum + chromeOf(d), 0);
    const avail = stage.clientWidth - 44 - gap * (visible.length - 1) - chromeTotal - 8;
    const totalW = visible.reduce((sum, d) => sum + parseInt(d.getAttribute('data-w'), 10), 0);
    let scale = Math.min(1, avail / totalW);
    if (view !== 'all') {
      const d = visible[0];
      if (d) {
        const hAvail = window.innerHeight - 240;
        scale = Math.min(1, avail / parseInt(d.getAttribute('data-w'), 10), hAvail / parseInt(d.getAttribute('data-h'), 10));
      }
    }
    scale = Math.max(0.18, scale);

    visible.forEach((d) => {
      const w = parseInt(d.getAttribute('data-w'), 10);
      const h = parseInt(d.getAttribute('data-h'), 10);
      const vp = d.querySelector('[data-viewport]');
      const frame = d.querySelector('[data-frame]');
      if (!vp || !frame) return;
      frame.style.width = w + 'px';
      frame.style.height = h + 'px';
      frame.style.transform = 'scale(' + scale + ')';
      vp.style.width = Math.round(w * scale) + 'px';
      vp.style.height = Math.round(h * scale) + 'px';
    });

    const first = visible[0];
    if (first) {
      const used = visible.reduce((sum, d) => {
        const sh = d.querySelector('[data-shell]');
        return sum + (sh ? sh.getBoundingClientRect().width : 0);
      }, 0) + gap * (visible.length - 1);
      const slack = Math.max(0, stage.clientWidth - 44 - used);
      devs.forEach((d) => { d.style.marginLeft = ''; });
      first.style.marginLeft = Math.round(slack / 2) + 'px';
    }

    const label = document.querySelector('[data-zoom]');
    if (label) label.textContent = Math.round(scale * 100) + '%';
  }

  set(view) { this.setState({ view: view }); }
  showAll = () => this.set('all');
  showDesktop = () => this.set('desktop');
  showTablet = () => this.set('tablet');
  showMobile = () => this.set('mobile');
  reload = () => {
    document.querySelectorAll('[data-frame]').forEach((f) => {
      const src = f.getAttribute('src');
      f.setAttribute('src', src);
    });
  };

  tab(name) {
    const on = this.state.view === name;
    return {
      background: on ? '#DCE84A' : 'transparent',
      color: on ? '#16221B' : '#C4D0C7',
      border: 'none', borderRadius: '999px', cursor: 'pointer',
      padding: '9px 18px', fontFamily: '"Space Mono", monospace',
      fontSize: '11px', letterSpacing: '0.1em', textTransform: 'uppercase',
      transition: 'background 240ms ease, color 240ms ease'
    };
  }

  renderVals() {
    return {
      showAll: this.showAll,
      showDesktop: this.showDesktop,
      showTablet: this.showTablet,
      showMobile: this.showMobile,
      reload: this.reload,
      tabAll: this.tab('all'),
      tabDesktop: this.tab('desktop'),
      tabTablet: this.tab('tablet'),
      tabMobile: this.tab('mobile')
    };
  }
}
</script>
